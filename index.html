<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizacion de Datos - BIC</title>
  <link rel="stylesheet" href="Webpage/Candidatos.es-ES.customcss.css">
</head>
<body>

  <div class="form-card-container">
    <div class="form-card">
      
      <!-- Logo y Título -->
      <img src="Imagenes/Logo.png" alt="Logo BIC" onerror="this.style.display='none'" class="top-logo" />
      <h2 class="form-title">Actualizacion de Datos</h2>
      <div class="badge-anon">📝 Portal de Atracción de Talento BIC</div>
      
      <form id="datosForm">
        
        <!-- DATOS PERSONALES -->
        <h3 class="section-header">
          <img src="Imagenes/Datos.png" alt="" onerror="this.style.display='none'" class="section-icon" /><span> Datos Personales</span>
        </h3>
        <div class="form-grid">
          <div class="form-group-custom">
            <label>Nombre *</label>
            <input type="text" id="nombre" required class="form-control-custom" />
          </div>
          <div class="form-group-custom">
            <label>Segundo Nombre</label>
            <input type="text" id="segundoNombre" class="form-control-custom" />
          </div>
          <div class="form-group-custom">
            <label>Apellido Paterno *</label>
            <input type="text" id="apellidoPaterno" required class="form-control-custom" />
          </div>
          <div class="form-group-custom">
            <label>Apellido Materno *</label>
            <input type="text" id="apellidoMaterno" required class="form-control-custom" />
          </div>
          <div class="form-group-custom">
            <label>Estado Civil *</label>
            <select id="estadoCivil" required class="form-control-custom">
              <option value="">Seleccione...</option>
              <option value="Soltero(a)">Soltero(a)</option>
              <option value="Casado(a)">Casado(a)</option>
              <option value="Unión Libre">Unión Libre</option>
              <option value="Divorciado(a)">Divorciado(a)</option>
              <option value="Viudo(a)">Viudo(a)</option>
            </select>
          </div>
        </div>

        <!-- DOMICILIO Y CONTACTO -->
        <h3 class="section-header">
          <img src="Imagenes/Domicilio.png" alt="" onerror="this.style.display='none'" class="section-icon" /><span> Domicilio y Contacto</span>
        </h3>
        <div class="form-grid">
          <div class="form-group-custom">
            <label>Código Postal *</label>
            <input type="text" id="codigoPostal" minlength="5" maxlength="5" required class="form-control-custom" />
            <div id="cp-status" class="cp-status-msg"></div>
          </div>
          <div class="form-group-custom">
            <label>Municipio / Ciudad</label>
            <input type="text" id="ciudad" readonly class="form-control-custom readonly-input" />
          </div>
          <div class="form-group-custom">
            <label for="colonia-input">Colonia o Fraccionamiento *</label>
            <select id="colonia-input" required class="form-control-custom" disabled>
              <option value="">Ingresa un código postal</option>
            </select>
          </div>
          <div class="form-group-custom">
            <label>Calle</label>
            <input type="text" id="calle" class="form-control-custom" />
          </div>
          <div class="form-group-custom">
            <label>Número</label>
            <input type="text" id="numeroDomicilio" class="form-control-custom" />
          </div>
          <div class="form-group-custom">
            <label>
              <img src="Imagenes/whatsapp.png" alt="" onerror="this.style.display='none'" class="inline-icon" /><span> Teléfono (WhatsApp) *</span>
            </label>
            <input type="tel" id="telefonoWhatsapp" minlength="10" maxlength="10" required class="form-control-custom" />
          </div>
          <div class="form-group-custom span-full">
            <label>Correo Electrónico</label>
            <input type="email" id="correo" class="form-control-custom" />
          </div>
        </div>

        <!-- EMERGENCIA Y TALLAS -->
        <h3 class="section-header">
          <img src="Imagenes/Emergencia.png" alt="" onerror="this.style.display='none'" class="section-icon" /><span> Contactos de Emergencia y Tallas</span>
        </h3>
        <div class="form-grid">
          <div class="form-group-custom">
            <label>Contacto de Emergencia 1 *</label>
            <input type="text" id="nombreContactoEmergencia" required class="form-control-custom" />
          </div>
          <div class="form-group-custom">
            <label>
              <img src="Imagenes/whatsapp.png" alt="" onerror="this.style.display='none'" class="inline-icon" /><span> Tel. Emergencia 1 (WhatsApp) *</span>
            </label>
            <input type="tel" id="telefonoContactoEmergencia" minlength="10" maxlength="10" required class="form-control-custom" />
          </div>
          <div class="form-group-custom">
            <label>Contacto de Emergencia 2</label>
            <input type="text" id="nombreContactoEmergencia2" class="form-control-custom" />
          </div>
          <div class="form-group-custom">
            <label>
              <img src="Imagenes/whatsapp.png" alt="" onerror="this.style.display='none'" class="inline-icon" /><span> Tel. Emergencia 2 (WhatsApp)</span>
            </label>
            <input type="tel" id="telefonoContactoEmergencia2" minlength="10" maxlength="10" class="form-control-custom" />
          </div>
          <div class="form-group-custom">
            <label>Talla de Playera</label>
            <select id="tallaPlayera" class="form-control-custom">
              <option value="">Seleccione...</option>
              <option value="XS">XS</option>
              <option value="S">S</option>
              <option value="M">M</option>
              <option value="L">L</option>
              <option value="XL">XL</option>
              <option value="2XL">2XL</option>
              <option value="3XL">3XL</option>
              <option value="4XL">4XL</option>
            </select>
          </div>
          <div class="form-group-custom">
            <label>Talla de Calzado (21 a 30)</label>
            <input type="number" step="0.5" min="21" max="30" id="tallaCalzado" placeholder="Ej. 26.5" class="form-control-custom" />
          </div>
        </div>

        <!-- INFORMACIÓN FAMILIAR -->
        <h3 class="section-header">
          <img src="Imagenes/Family.png" alt="" onerror="this.style.display='none'" class="section-icon" /><span> Información Familiar</span>
        </h3>
        
        <!-- SECCIÓN PAREJA -->
        <div id="seccionPareja" class="dynamic-section hidden">
          <h4 class="dynamic-title">Datos de la Pareja</h4>
          <div class="form-grid">
            <div class="form-group-custom">
              <label>Nombre de Pareja *</label>
              <input type="text" id="pareja" class="form-control-custom bg-white" />
            </div>
            <div class="form-group-custom">
              <label>Fecha Nacimiento Pareja *</label>
              <input type="date" id="fechaNacPareja" class="form-control-custom bg-white" />
            </div>
          </div>
          <div class="file-upload-wrapper mt-3">
            <label>💍 Acta de Matrimonio / Unión Libre *</label>
            <input type="file" id="fileActaPareja" accept=".pdf,image/*" class="file-input-custom" />
          </div>
        </div>

        <!-- SECCIÓN HIJOS -->
        <div class="form-grid">
          <div class="form-group-custom">
            <label>¿Tiene hijos?</label>
            <select id="tieneHijos" class="form-control-custom">
              <option value="No">No</option>
              <option value="Si">Sí</option>
            </select>
          </div>
          <div id="seccionCantidadHijos" class="form-group-custom hidden">
            <label>¿Cuántos hijos tiene?</label>
            <select id="cantidadHijos" class="form-control-custom">
              <option value="0">Seleccione...</option>
              <option value="1">1</option><option value="2">2</option><option value="3">3</option>
              <option value="4">4</option><option value="5">5</option><option value="6">6</option>
              <option value="7">7</option><option value="8">8</option><option value="9">9</option>
              <option value="10">10</option>
            </select>
          </div>
        </div>
        
        <div id="contenedorHijos"></div>

        <button type="submit" id="btnEnviar" class="btn-submit">Guardar Candidato</button>
      </form>

      <div id="status" class="status-msg" role="status" aria-live="polite"></div>
      <img src="Imagenes/barra.jpg" alt="Barra Decorativa" onerror="this.style.display='none'" class="bottom-bar" />
    </div>
  </div>

  <script src="Webpage/Candidatos.es-ES.customjs.js?v=20260917-2"></script>
</body>
</html>
